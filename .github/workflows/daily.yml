name: 일일 시세 수집 및 차트 생성

on:
  schedule:
    # 2026-09-22 사고 12: 정규장 마감 직후(15:45 KST)에 돌리면 Daum API의
    # highPrice/lowPrice가 아직 최종값으로 안정화되기 전이라, 본문에 서술되는
    # 고가/저가가 나중(저녁) 검증 시점과 달라지는 사고가 실제로 발생함
    # (종가/전일종가/등락률은 이 시점에도 정확 — regularTradePrice는 즉시 확정되는
    # 값이라 문제없었음). 시간외 거래(16:00~18:00, 관측상 19:59까지도 움직임)가
    # 충분히 끝난 뒤로 미뤄서 고가/저가까지 안정된 값을 가져오도록 한다.
    # 21:00 KST = 12:00 UTC.
    - cron: "0 12 * * 1-5"
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      date:
        description: "기준일 (YYYY-MM-DD, 비우면 오늘)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 공휴일·휴장일이면 건너뛰기
        # 2026-09-25 사고 15·16: 기존엔 주말만 걸러서 추석 연휴(09-24·25)에도 돌았고,
        # 전 거래일(09-23) 데이터로 똑같은 원고를 매일 다시 만들었음.
        # Daum 삼성전자 시세의 tradeDate가 오늘(KST)이 아니면 휴장일로 보고 건너뛴다.
        # 조회 실패 시엔 진행(fail-open) — 판단 이유는 이 단계 로그에 남음.
        id: guard
        if: github.event_name == 'schedule'
        run: python market_guard.py >> "$GITHUB_OUTPUT"

      - name: 시세 수집
        if: github.event_name == 'workflow_dispatch' || steps.guard.outputs.skip == 'false'
        run: python fetch.py ${{ github.event.inputs.date }}

      - name: 지표 계산 및 차트 생성
        if: github.event_name == 'workflow_dispatch' || steps.guard.outputs.skip == 'false'
        run: python build.py

      - name: DeepSeek API로 원고 생성
        if: github.event_name == 'workflow_dispatch' || steps.guard.outputs.skip == 'false'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python generate_articles.py
        
      - name: 결과 커밋
        if: github.event_name == 'workflow_dispatch' || steps.guard.outputs.skip == 'false'
        run: |
          git config user.name  "chart-today-bot"
          git config user.email "actions@github.com"
          git add -A data out claude watchlist.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 + 원고 생성 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            out/
            data/
          retention-days: 7
