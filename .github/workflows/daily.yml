name: 일일 시세 수집 및 차트 생성

on:
  schedule:
    # 2026-09-29 형 지시: 원고 생성(DeepSeek)은 한국시간 16:00 시작,
    # 블로그 발행(클로드 예약 작업)은 한국시간 17:00. 16:00 KST = 07:00 UTC.
    #
    # ⚠️ 사고 12(2026-09-22) 기록은 그대로 유효하다: 정규장 마감(15:30) 직후에는
    # Daum API의 highPrice/lowPrice가 시간외 거래(16:00~19:59)로 이후에도 갱신되므로,
    # 본문 서술의 장중 고가/저가가 저녁에 재검증하면 달라져 있을 수 있다.
    # 종가·전일종가·등락률은 regularTradePrice 기반이라 15:30에 즉시 확정되어
    # 이 시각에도 정확하다. 고가/저가 서술은 이 한계를 감안해서 볼 것.
    #
    # ⚠️ 2026-10-12: GitHub이 이 저장소의 schedule 이벤트를 통째로 전달하지 않아
    # 하루치 원고가 누락됐다(워크플로 active, cron 정상, 생성된 run 0건).
    # 직전 10-09 실행도 약 7시간 지연됐다. GitHub은 schedule 이벤트가 고부하 시
    # 지연되거나 누락될 수 있다고 자체 문서에 명시한다.
    # → 발화를 한 번만 믿지 않고 15분 간격으로 3번 건다. 정시(0분)는 부하가 가장
    #   큰 시각이라 피했고, 통상 지연(7~13분)을 감안해도 마지막 시도가 16:50 전에
    #   끝나 17:00 발행에 맞는다. 3번 중 1번만 전달돼도 그날 원고는 생긴다.
    #   중복 실행은 아래 "오늘 원고가 이미 있으면 건너뛰기" 단계가 막는다.
    - cron: "5 7 * * 1-5"     # 16:05 KST
    - cron: "20 7 * * 1-5"    # 16:20 KST
    - cron: "35 7 * * 1-5"    # 16:35 KST
  workflow_dispatch:        # 수동 실행 버튼
    inputs:
      date:
        description: "기준일 (YYYY-MM-DD, 비우면 오늘)"
        required: false

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: 오늘 원고가 이미 있으면 건너뛰기
        # 위 cron 3개 중 두 번째·세 번째 발화가 같은 날 원고를 또 만들지 않도록 한다.
        # (concurrency group 이 직렬화하므로 이 시점의 checkout 에는 앞선 실행의
        #  커밋이 이미 들어와 있다.) 수동 실행(workflow_dispatch)은 이 검사를 거치지
        # 않으므로 강제 재생성이 그대로 된다. DeepSeek 호출도 하루 1회로 유지된다.
        id: dedup
        if: github.event_name == 'schedule'
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y%m%d)
          if ls claude/발행분-*-$TODAY.md >/dev/null 2>&1; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            echo "[dedup] $TODAY 원고 이미 존재 — 건너뜀"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "[dedup] $TODAY 원고 없음 — 진행"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 공휴일·휴장일이면 건너뛰기
        # 2026-09-25 사고 15·16: 기존엔 주말만 걸러서 추석 연휴(09-24·25)에도 돌았고,
        # 전 거래일(09-23) 데이터로 똑같은 원고를 매일 다시 만들었음.
        # Daum 삼성전자 시세의 tradeDate가 오늘(KST)이 아니면 휴장일로 보고 건너뛴다.
        # 조회 실패 시엔 진행(fail-open) — 판단 이유는 이 단계 로그에 남음.
        id: guard
        if: github.event_name == 'schedule'
        run: python market_guard.py >> "$GITHUB_OUTPUT"

      - name: 시세 수집
        if: github.event_name == 'workflow_dispatch' || (steps.guard.outputs.skip == 'false' && steps.dedup.outputs.done == 'false')
        run: python fetch.py ${{ github.event.inputs.date }}

      - name: 지표 계산 및 차트 생성
        if: github.event_name == 'workflow_dispatch' || (steps.guard.outputs.skip == 'false' && steps.dedup.outputs.done == 'false')
        run: python build.py

      - name: DeepSeek API로 원고 생성
        if: github.event_name == 'workflow_dispatch' || (steps.guard.outputs.skip == 'false' && steps.dedup.outputs.done == 'false')
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python generate_articles.py
        
      - name: 결과 커밋
        if: github.event_name == 'workflow_dispatch' || (steps.guard.outputs.skip == 'false' && steps.dedup.outputs.done == 'false')
        run: |
          git config user.name  "chart-today-bot"
          git config user.email "actions@github.com"
          git add -A data out claude watchlist.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 + 원고 생성 $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push
          fi

      - name: 실패 시 로그 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            out/
            data/
          retention-days: 7
